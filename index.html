<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 顶部导航 -->
<nav class="navbar">
    <div class="logo">我的个人主页</div>
    <div class="nav-menu">
        <a href="#home" class="nav-item">首页</a>
        <a href="#about" class="nav-item">关于我</a>
        <a href="#photo" class="nav-item">相册</a>
        <a href="#contact" class="nav-item">联系我</a>
    </div>
</nav>

<!-- 首页头像区域 -->
<section id="home" class="home-box">
    <div class="home-content">
        <img src="avatar.jpg" class="my-avatar">
        <h1>刘媚</h1>
        <p>热爱生活 | 享受文字 | 持续成长</p>
    </div>
</section>

<!-- 关于我 -->
<section id="about" class="about-box">
    <h2>👤 关于我</h2>
    <div class="about-text">
        <p>喜欢将看到的写下来</p>
        <p>新闻传播专业</p>
    </div>
</section>

<!-- 相册区域 -->
<section id="photo" class="photo-box">
    <h2>📷 我的相册</h2>
    <div class="photo-slide">
        <img src="pic1.jpg" class="slide-img">
        <img src="pic2.jpg" class="slide-img">
        <img src="pic3.jpg" class="slide-img">
    </div>
    <div class="slide-btn">
        <button id="prev">← 上一张</button>
        <button id="next">下一张 →</button>
    </div>
</section>

<!-- 联系方式 -->
<section id="contact" class="contact-box">
    <h2>📩 联系我</h2>
    <p>微信：May-Upbeat</p>
    <p>邮箱：meiwan999@qq.com</p>
</section>

<!-- 底部 -->
<footer class="footer">
    <p>© 2026 我的个人主页</p>
</footer>

<script src="script.js"></script>
</body>
</html>
